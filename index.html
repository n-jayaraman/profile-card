<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile Card</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  overflow-x: hidden;
}

.main {
  min-height: 100vh;
  background: linear-gradient(to right, rgb(125, 62, 131), rgb(192, 138, 197));
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px;
}

h1 {
  font-size: clamp(2rem, 5vw, 4rem);
  margin-bottom: 20px;
}

.top-btns {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  width: 80px;
}

.container {
  display: flex;
  gap: 30px;
  width: 100%;
  max-width: 1000px;
  flex-wrap: wrap;
}


.m1 {
  flex: 1 1 300px;
  background-color: rgb(194, 141, 194);
  padding: 20px;
  border-radius: 20px;
}

.m1 label {
  font-size: 1.2rem;
}

.m1 input {
  width: 100%;
  height: 35px;
  margin-bottom: 15px;
  padding: 5px;
}

.m1 button {
  width: 100%;
  height: 40px;
}


.m2 {
  flex: 1 1 300px;
  background-color: white;
  padding: 20px;
  border-radius: 20px;
  text-align: center;
}

#pi {
  width: 100%;
  max-width: 250px;
  height: auto;
  border: 2px solid black;
  border-radius: 50%;
  margin: 20px 0;
}
#da:hover{
    background-color: black;
    color: white;
}


@media (max-width: 600px) {
  .container {
    flex-direction: column;
  }
}
</style>
</head>

<body>

<div class="main">
  <h1>Profile Card</h1>

  <div class="top-btns">
    <button onclick="lightMode()">Light</button>
    <button onclick="darkMode()" id="da">Dark</button>
  </div>

  <div class="container">
    <div class="m1">
      <label>Name</label>
      <input type="text" id="na" placeholder="Enter your name">

      <label>Img</label>
      <input type="text" id="im" placeholder="Enter img source">

      <label>Bio</label>
      <input type="text" id="bio" placeholder="Enter your bio">

      <button onclick="updateProfile()">SUBMIT</button>
    </div>

    <div class="m2">
      <h2 id="pn">NAME</h2>
      <img src="" id="pi">
      <h3 id="pb">BIO</h3>
    </div>
  </div>
</div>

<script>
function updateProfile(){
  pn.innerHTML = na.value;
  pi.src = im.value;
  pb.innerHTML = bio.value;
}

function lightMode(){
  document.querySelector('.m2').style.background = 'white';
  pn.style.color = 'black';
  pb.style.color = 'black';
  pi.style.borderColor = 'black';
}

function darkMode(){
  document.querySelector('.m2').style.background = 'black';
  pn.style.color = 'white';
  pb.style.color = 'white';
  pi.style.borderColor = 'white';
}
</script>

</body>
</html>
